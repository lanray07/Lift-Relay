name: App Store Upload

on:
  workflow_dispatch:

concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archive and upload to App Store Connect
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          standard_key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$standard_key_dir"
          cp "$key_path" "$standard_key_dir/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$standard_key_dir/AuthKey_${API_KEY_ID}.p8"
          certificate_path="$RUNNER_TEMP/AppleDistribution.cer"
          printf '%s' "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          api_key_json="$RUNNER_TEMP/app-store-connect-api-key.json"
          jq -n \
            --arg key_id "$API_KEY_ID" \
            --arg issuer_id "$API_ISSUER_ID" \
            --rawfile key "$key_path" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$api_key_json"
          echo "AUTH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "API_KEY_JSON=$api_key_json" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"

      - name: Restore encrypted distribution certificate
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: lift-relay-app-store-signing-v1

      - name: Install distribution signing certificate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain_path="$RUNNER_TEMP/lift-relay-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$DISTRIBUTION_CERTIFICATE_PATH" \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          signing_dir="$RUNNER_TEMP/signing"
          signing_cache="$RUNNER_TEMP/signing-cache"
          mkdir -p "$signing_dir"
          mkdir -p "$signing_cache"
          signing_secret="$(openssl dgst -sha256 "$AUTH_KEY_PATH" | awk '{print $2}')"
          encrypted_p12="$signing_cache/distribution.p12.enc"

          if [[ -f "$encrypted_p12" ]]; then
            p12_path="$RUNNER_TEMP/distribution.p12"
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in "$encrypted_p12" \
              -out "$p12_path" \
              -pass "pass:$signing_secret"
            security import "$p12_path" \
              -k "$keychain_path" \
              -P "" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          else
            fastlane run cert \
              api_key_path:"$API_KEY_JSON" \
              team_id:"$APPLE_TEAM_ID" \
              development:false \
              output_path:"$signing_dir" \
              keychain_path:"$keychain_path" \
              keychain_password:"$keychain_password"
            p12_path="$(find "$signing_dir" -maxdepth 1 -name '*.p12' -print -quit)"
            test -n "$p12_path"
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in "$p12_path" \
              -out "$encrypted_p12" \
              -pass "pass:$signing_secret"
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Save encrypted distribution certificate
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: lift-relay-app-store-signing-v1

      - name: Create App Store provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_dir="$RUNNER_TEMP/signing"
          mkdir -p "$signing_dir"
          fastlane run sigh \
            api_key_path:"$API_KEY_JSON" \
            team_id:"$APPLE_TEAM_ID" \
            app_identifier:"com.LiftRelay.app" \
            force:true \
            output_path:"$signing_dir" \
            filename:"LiftRelay_AppStore.mobileprovision"
          profile_path="$signing_dir/LiftRelay_AppStore.mobileprovision"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project LiftRelay.xcodeproj \
            -scheme LiftRelay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiftRelay.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.LiftRelay.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LiftRelay.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload build to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ipa_path="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lift-relay-export-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/LiftRelay.xcarchive/Info.plist
            ${{ runner.temp }}/export/DistributionSummary.plist
            ${{ runner.temp }}/export/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7
