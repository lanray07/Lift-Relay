name: Build App Store Localizations

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install --disable-pip-version-check requests
      - name: Generate all App Store languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o
        run: python Scripts/build-app-store-localizations.py
      - name: Validate localization limits
        run: python Scripts/validate-app-store-assets.py --metadata-only
      - name: Commit generated localization manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/metadata.json
          git diff --cached --quiet || git commit -m "Add all App Store localizations"
          git push
