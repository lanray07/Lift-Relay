name: LiftRelay
options:
  bundleIdPrefix: com.LiftRelay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: com.LiftRelay.app
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
targets:
  LiftRelay:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Supporting/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Supporting/LiftRelay.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: []
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
  LiftRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LiftRelayCoreTests
    dependencies:
      - target: LiftRelay
schemes:
  LiftRelay:
    build:
      targets:
        LiftRelay: all
        LiftRelayTests: [test]
    test:
      targets: [LiftRelayTests]
